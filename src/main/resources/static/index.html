<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国杀 · 联机测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { width: 100%; max-width: 520px; padding: 20px; }
        .card { background: #16213e; border-radius: 12px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .card + .card { margin-top: 16px; }
        h2 { font-size: 18px; margin-bottom: 16px; color: #e94560; }
        h3 { font-size: 15px; margin-bottom: 12px; color: #ccc; }

        /* 输入 & 按钮 */
        .input-group { display: flex; gap: 8px; margin-bottom: 12px; }
        .input-group input { flex: 1; padding: 10px 14px; border: 1px solid #0f3460; border-radius: 8px; background: #0f3460; color: #eee; font-size: 14px; outline: none; }
        .input-group input:focus { border-color: #e94560; }
        .input-group input::placeholder { color: #666; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; transition: background .2s; white-space: nowrap; }
        .btn-primary { background: #e94560; color: #fff; }
        .btn-primary:hover { background: #d63851; }
        .btn-success { background: #0f3460; color: #eee; }
        .btn-success:hover { background: #1a4a8a; }
        .btn-danger { background: #533; color: #f88; }
        .btn-danger:hover { background: #755; }
        .btn-warning { background: #b8860b; color: #fff; }
        .btn-warning:hover { background: #9a7209; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-block { width: 100%; }

        /* 隐藏 */
        .hidden { display: none !important; }

        /* 房间列表 */
        .room-list { max-height: 240px; overflow-y: auto; }
        .room-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #0f3460; border-radius: 8px; margin-bottom: 8px; }
        .room-item .info { flex: 1; }
        .room-item .name { font-weight: bold; }
        .room-item .meta { font-size: 12px; color: #888; margin-top: 2px; }

        /* 玩家列表 */
        .player-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .player-chip { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: #0f3460; border-radius: 20px; font-size: 14px; }
        .player-chip .host-tag { font-size: 10px; background: #e94560; color: #fff; padding: 1px 6px; border-radius: 8px; }
        .player-chip .ready-tag { font-size: 10px; background: #2a5; color: #fff; padding: 1px 6px; border-radius: 8px; }
        .player-chip .not-ready-tag { font-size: 10px; background: #555; color: #ccc; padding: 1px 6px; border-radius: 8px; }

        /* 状态条 */
        .status-bar { text-align: center; padding: 8px; color: #888; font-size: 13px; }
        .status-bar .error { color: #f88; }
        .status-bar .info { color: #8af; }
        .status-bar .success { color: #8f8; }

        /* 动画 */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn .3s ease; }
    </style>
</head>
<body>
<div class="container">

    <!-- ========== 登录界面 ========== -->
    <div id="loginScreen" class="card fade-in">
        <h2>🔰 三国杀 · 联机测试</h2>
        <p style="margin-bottom:16px;color:#888;font-size:13px;">输入昵称，进入游戏大厅</p>
        <div class="input-group">
            <input type="text" id="nameInput" placeholder="输入你的昵称..." maxlength="12">
            <button class="btn btn-primary" id="loginBtn">进入</button>
        </div>
        <div class="status-bar"><span id="loginStatus">启动服务端后，输入昵称点「进入」</span></div>
    </div>

    <!-- ========== 大厅界面 ========== -->
    <div id="lobbyScreen" class="hidden">
        <div class="card fade-in">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <h2>🏠 游戏大厅</h2>
                <span id="playerBadge" style="background:#0f3460;padding:4px 12px;border-radius:12px;font-size:13px;"></span>
            </div>

            <!-- 创建房间 -->
            <div class="input-group">
                <input type="text" id="roomNameInput" placeholder="房间名称（可选）" maxlength="20">
                <button class="btn btn-success" id="createRoomBtn">创建房间</button>
            </div>

            <!-- 房间列表 -->
            <h3>可加入的房间</h3>
            <div id="roomList" class="room-list">
                <div style="color:#666;font-size:13px;text-align:center;padding:20px;">暂无房间，创建第一个吧</div>
            </div>

            <!-- 分离线 -->
            <hr style="border-color:#0f3460;margin:16px 0;">
            <div class="input-group">
                <input type="text" id="roomIdInput" placeholder="输入房间ID加入" maxlength="40">
                <button class="btn btn-success" id="joinByIdBtn">加入</button>
            </div>
        </div>
        <div class="status-bar" id="lobbyStatus">已连接服务器</div>
    </div>

    <!-- ========== 房间界面 ========== -->
    <div id="roomScreen" class="hidden">
        <div class="card fade-in">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <h2 style="margin-bottom:0;">🚪 <span id="roomTitle">房间</span></h2>
                <button class="btn btn-danger btn-sm" id="leaveRoomBtn">离开</button>
            </div>
            <div style="font-size:12px;color:#888;margin-bottom:16px;">房间ID: <span id="roomIdDisplay" style="font-family:monospace;"></span></div>

            <h3>玩家列表</h3>
            <div id="playerList" class="player-grid">
                <div style="color:#666;font-size:13px;">等待玩家加入...</div>
            </div>

            <hr style="border-color:#0f3460;margin:16px 0;">

            <button class="btn btn-warning btn-block" id="readyBtn">✅ 准备</button>
            <button class="btn btn-primary btn-block hidden" id="startGameBtn" style="margin-top:8px;">🎮 开始游戏</button>
            <div style="font-size:12px;color:#888;margin-top:8px;text-align:center;" id="roomHint"></div>
        </div>
        <div class="status-bar" id="roomStatus"></div>
    </div>

</div>

<script>
// ============================================================
//  状态
// ============================================================
const STATE = {
    playerId: null,
    playerName: null,
    ws: null,
    currentRoom: null,    // { roomId, players, ownerPlayerId, ... }
    isHost: false,
    isReady: false,
};

const STORAGE_KEY = 'lb_player_name';

// ============================================================
//  DOM 引用
// ============================================================
const $ = id => document.getElementById(id);
const loginScreen     = $('loginScreen');
const lobbyScreen     = $('lobbyScreen');
const roomScreen      = $('roomScreen');
const nameInput       = $('nameInput');
const loginBtn        = $('loginBtn');
const loginStatus     = $('loginStatus');
const playerBadge     = $('playerBadge');
const roomNameInput   = $('roomNameInput');
const createRoomBtn   = $('createRoomBtn');
const roomList        = $('roomList');
const roomIdInput     = $('roomIdInput');
const joinByIdBtn     = $('joinByIdBtn');
const lobbyStatus     = $('lobbyStatus');
const roomTitle       = $('roomTitle');
const roomIdDisplay   = $('roomIdDisplay');
const playerList      = $('playerList');
const readyBtn        = $('readyBtn');
const startGameBtn    = $('startGameBtn');
const leaveRoomBtn    = $('leaveRoomBtn');
const roomHint        = $('roomHint');
const roomStatus      = $('roomStatus');

// ============================================================
//  辅助
// ============================================================
function showScreen(screen) {
    [loginScreen, lobbyScreen, roomScreen].forEach(s => s.classList.add('hidden'));
    screen.classList.remove('hidden');
}

function status(el, msg, type = 'info') {
    el.innerHTML = `<span class="${type}">${msg}</span>`;
}

function showError(msg) { status(lobbyStatus, '❌ ' + msg, 'error'); }
function showInfo(msg)  { status(lobbyStatus, msg, 'info'); }
function showSuccess(msg) { status(lobbyStatus, '✔ ' + msg, 'success'); }

function sendMsg(data) {
    if (STATE.ws && STATE.ws.readyState === WebSocket.OPEN) {
        STATE.ws.send(JSON.stringify(data));
    }
}

// ============================================================
//  WebSocket
// ============================================================
function connectWebSocket(name) {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${location.host}/ws/game?name=${encodeURIComponent(name)}`;
    const ws = new WebSocket(wsUrl);

    ws.onopen = () => {
        showInfo('WebSocket 已连接');
    };

    ws.onmessage = (event) => {
        try {
            const msg = JSON.parse(event.data);
            handleMessage(msg);
        } catch (e) {
            console.warn('消息解析失败:', event.data);
        }
    };

    ws.onclose = () => {
        showError('与服务器断开连接');
        STATE.ws = null;
        // 回到登录界面
        setTimeout(() => {
            showScreen(loginScreen);
            status(loginStatus, '连接已断开，刷新页面重试', 'error');
        }, 500);
    };

    ws.onerror = () => {
        showError('连接错误，请确认服务端已启动');
    };

    STATE.ws = ws;
}

// ============================================================
//  消息处理
// ============================================================
function handleMessage(msg) {
    switch (msg.type) {
        case 'CONNECTED':
            STATE.playerId = msg.playerId;
            STATE.playerName = msg.playerName;
            playerBadge.textContent = `👤 ${msg.playerName}`;
            showSuccess(`以「${msg.playerName}」身份进入大厅`);
            showScreen(lobbyScreen);
            break;

        case 'ROOM_LIST':
            renderRoomList(msg.rooms || []);
            break;

        case 'ROOM_CREATED':
            STATE.currentRoom = msg.room;
            enterRoomView(msg.room);
            break;

        case 'ROOM_JOINED':
            STATE.currentRoom = msg.room;
            enterRoomView(msg.room);
            break;

        case 'ROOM_UPDATE':
            STATE.currentRoom = msg.room;
            updateRoomView(msg.room);
            break;

        case 'ROOM_LEFT':
            STATE.currentRoom = null;
            STATE.isHost = false;
            STATE.isReady = false;
            showScreen(lobbyScreen);
            showInfo('已离开房间');
            break;

        case 'PLAYER_JOINED':
            showInfo(`${msg.playerName} 加入了房间`);
            break;

        case 'PLAYER_LEFT':
            showInfo(`${msg.playerName} 离开了房间`);
            break;

        case 'GAME_START':
            status(roomStatus, '🎉 游戏开始！（游戏引擎尚未实现，此为联机验证）', 'success');
            startGameBtn.disabled = true;
            startGameBtn.textContent = '⏳ 游戏进行中';
            readyBtn.disabled = true;
            leaveRoomBtn.disabled = true;
            // 弹窗提示
            setTimeout(() => {
                alert('🎮 游戏开始！\n\n联机通信验证通过 ✅\n\n房间内所有玩家都已收到 GAME_START 消息\n\n（游戏引擎待开发）');
            }, 300);
            break;

        case 'HEARTBEAT_ACK':
            // 心跳回复，忽略
            break;

        case 'ERROR':
            showError(msg.message);
            if (STATE.currentRoom) {
                status(roomStatus, '❌ ' + msg.message, 'error');
            }
            break;

        default:
            console.log('未处理的消息类型:', msg.type, msg);
    }
}

// ============================================================
//  房间列表渲染
// ============================================================
function renderRoomList(rooms) {
    if (!rooms || rooms.length === 0) {
        roomList.innerHTML = '<div style="color:#666;font-size:13px;text-align:center;padding:20px;">暂无房间，创建第一个吧</div>';
        return;
    }
    roomList.innerHTML = rooms.map(r => {
        const canJoin = r.playerCount < r.maxPlayers && r.status === 'WAITING';
        return `
            <div class="room-item">
                <div class="info">
                    <div class="name">${escHtml(r.roomName)}</div>
                    <div class="meta">${r.playerCount}/${r.maxPlayers} 人 · ${r.status === 'WAITING' ? '等待中' : '进行中'}</div>
                </div>
                <button class="btn btn-success btn-sm join-room-btn" data-room-id="${r.roomId}" ${canJoin ? '' : 'disabled'}>
                    ${canJoin ? '加入' : (r.status !== 'WAITING' ? '进行中' : '已满')}
                </button>
            </div>
        `;
    }).join('');

    // 绑定加入按钮事件
    document.querySelectorAll('.join-room-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const roomId = btn.dataset.roomId;
            sendMsg({ type: 'JOIN_ROOM', roomId });
        });
    });
}

// ============================================================
//  房间界面
// ============================================================
function enterRoomView(room) {
    STATE.currentRoom = room;
    STATE.isHost = room.ownerPlayerId === STATE.playerId;
    STATE.isReady = room.players.find(p => p.playerId === STATE.playerId)?.isReady || false;
    showScreen(roomScreen);
    updateRoomView(room);
}

function updateRoomView(room) {
    STATE.currentRoom = room;
    STATE.isHost = room.ownerPlayerId === STATE.playerId;
    const me = room.players.find(p => p.playerId === STATE.playerId);
    STATE.isReady = me?.isReady || false;

    roomTitle.textContent = escHtml(room.roomName);
    roomIdDisplay.textContent = room.roomId;

    // 玩家列表
    playerList.innerHTML = room.players.map(p => {
        const isOwner = p.playerId === room.ownerPlayerId;
        const readyText = p.isReady ? '已准备' : '未准备';
        const readyClass = p.isReady ? 'ready-tag' : 'not-ready-tag';
        const isMe = p.playerId === STATE.playerId;
        return `
            <div class="player-chip">
                <span>${isMe ? '⭐' : '👤'} ${escHtml(p.playerName)}</span>
                ${isOwner ? '<span class="host-tag">房主</span>' : ''}
                <span class="${readyClass}">${readyText}</span>
            </div>
        `;
    }).join('');

    // 准备按钮
    readyBtn.textContent = STATE.isReady ? '⏳ 取消准备' : '✅ 准备';
    readyBtn.classList.toggle('btn-warning', STATE.isReady);
    readyBtn.classList.toggle('btn-success', !STATE.isReady);

    // 开始按钮（仅房主可见）
    if (STATE.isHost) {
        startGameBtn.classList.remove('hidden');
        const allReady = room.players.every(p => p.isReady);
        startGameBtn.disabled = !allReady || room.players.length < 2;
        startGameBtn.textContent = `🎮 开始游戏 (${room.players.length}人)`;
    } else {
        startGameBtn.classList.add('hidden');
    }

    // 提示
    if (room.players.length < 2) {
        roomHint.textContent = '至少需要 2 名玩家才能开始游戏';
    } else if (STATE.isHost && room.players.some(p => !p.isReady)) {
        roomHint.textContent = '等待所有玩家准备...';
    } else if (STATE.isHost) {
        roomHint.textContent = '全员已准备，可以开始游戏！';
    } else {
        roomHint.textContent = '等待房主开始游戏';
    }

    status(roomStatus, `房间内有 ${room.players.length} 名玩家`, 'info');
}

// ============================================================
//  工具
// ============================================================
function escHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
}

// ============================================================
//  事件绑定
// ============================================================

// 登录
loginBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    if (!name) {
        status(loginStatus, '请输入昵称', 'error');
        return;
    }
    localStorage.setItem(STORAGE_KEY, name);
    status(loginStatus, '正在连接服务器...', 'info');
    loginBtn.disabled = true;
    connectWebSocket(name);
});

nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loginBtn.click();
});

// 创建房间
createRoomBtn.addEventListener('click', () => {
    const name = roomNameInput.value.trim() || STATE.playerName + '的房间';
    sendMsg({ type: 'CREATE_ROOM', roomName: name, maxPlayers: 8 });
    roomNameInput.value = '';
});

roomNameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') createRoomBtn.click();
});

// 按ID加入
joinByIdBtn.addEventListener('click', () => {
    const roomId = roomIdInput.value.trim();
    if (!roomId) { showError('请输入房间ID'); return; }
    sendMsg({ type: 'JOIN_ROOM', roomId });
    roomIdInput.value = '';
});

roomIdInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') joinByIdBtn.click();
});

// 准备/取消准备
readyBtn.addEventListener('click', () => {
    const newReady = !STATE.isReady;
    sendMsg({ type: 'PLAYER_READY', ready: newReady });
});

// 开始游戏
startGameBtn.addEventListener('click', () => {
    sendMsg({ type: 'START_GAME' });
});

// 离开房间
leaveRoomBtn.addEventListener('click', () => {
    sendMsg({ type: 'LEAVE_ROOM' });
});

// ============================================================
//  初始化：检查本地存储的名称
// ============================================================
(function init() {
    const savedName = localStorage.getItem(STORAGE_KEY);
    if (savedName) {
        nameInput.value = savedName;
        // 自动连接
        status(loginStatus, '正在自动连接...', 'info');
        loginBtn.disabled = true;
        connectWebSocket(savedName);
    } else {
        nameInput.focus();
    }
})();

console.log('🔰 三国杀联机测试前端已加载');
console.log('WebSocket 端点: ws://' + location.host + '/ws/game?name=xxx');
</script>
</body>
</html>
