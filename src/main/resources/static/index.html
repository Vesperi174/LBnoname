<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国杀 · 联机测试</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">

    <!-- ========== 登录界面 ========== -->
    <div id="loginScreen" class="card fade-in">
        <h2>三国杀 · 联机测试</h2>
        <p class="login-hint">输入昵称，选择游戏模式</p>
        <div class="input-group">
            <input type="text" id="nameInput" placeholder="输入你的昵称..." maxlength="12">
            <button class="btn btn-primary" id="loginBtn">进入</button>
        </div>
        <div class="status-bar"><span id="loginStatus">启动服务端后，输入昵称点「进入」</span></div>
    </div>

    <!-- ========== 模式选择界面 ========== -->
    <div id="modeSelectScreen" class="hidden">
        <div class="card fade-in mode-select-card">
            <h2>选择游戏模式</h2>
            <p class="mode-select-hint">欢迎，<span id="modePlayerName"></span></p>
            <div class="mode-buttons">
                <button class="btn btn-mode btn-mode-single" id="singleModeBtn">
                    <span class="mode-icon">S</span>
                    <span class="mode-label">单机模式</span>
                    <span class="mode-desc">本地单人游戏</span>
                </button>
                <button class="btn btn-mode btn-mode-multi" id="multiModeBtn">
                    <span class="mode-icon">M</span>
                    <span class="mode-label">联机模式</span>
                    <span class="mode-desc">进入在线大厅</span>
                </button>
            </div>
            <button class="btn btn-back-link" id="backToLoginBtn">重新输入昵称</button>
        </div>
    </div>

    <!-- ========== 大厅界面 ========== -->
    <div id="lobbyScreen" class="hidden">
        <div class="card fade-in">
            <div class="lobby-layout">
                <div class="lobby-left">
                    <div class="lobby-header">
                        <h2 class="lobby-title">游戏大厅</h2>
                        <span id="playerBadge" class="player-badge"></span>
                    </div>
                    <div class="input-group">
                        <input type="text" id="roomNameInput" placeholder="房间名称（可选）" maxlength="20">
                        <button class="btn btn-success" id="createRoomBtn">创建房间</button>
                    </div>
                    <h3>可加入的房间</h3>
                    <div id="roomList" class="room-list">
                        <div class="empty-hint">暂无房间，创建第一个吧</div>
                    </div>
                    <hr class="divider">
                    <div class="input-group">
                        <input type="text" id="roomIdInput" placeholder="输入房间ID加入" maxlength="40">
                        <button class="btn btn-success" id="joinByIdBtn">加入</button>
                    </div>
                </div>
                <div class="lobby-right">
                    <div class="online-count-header">
                        在线玩家
                        <span class="count-badge" id="onlineCount">0</span>
                    </div>
                    <div id="onlinePlayerList" class="online-player-list">
                        <div class="empty-hint">暂无在线玩家</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="status-bar" id="lobbyStatus">已连接服务器</div>
    </div>

    <!-- ========== 房间界面 ========== -->
    <div id="roomScreen" class="hidden">
        <div class="card fade-in">
            <div class="room-header-bar">
                <h2 class="room-title"><span id="roomTitle">房间</span></h2>
                <button class="btn btn-danger btn-sm" id="leaveRoomBtn">离开</button>
            </div>
            <p class="room-id-line">房间ID: <span id="roomIdDisplay" class="room-id-val"></span></p>
            <h3>玩家列表</h3>
            <div id="playerList" class="player-grid">
                <div class="empty-hint">等待玩家加入...</div>
            </div>
            <hr class="divider">
            <button class="btn btn-warning btn-block" id="readyBtn">准备</button>
            <button class="btn btn-primary btn-block hidden" id="startGameBtn">开始游戏</button>
            <p class="room-hint" id="roomHint"></p>
        </div>
        <div class="status-bar" id="roomStatus"></div>
    </div>

    <!-- ============================================================
         对局界面（待重建）
         ============================================================ -->
    <div id="gameScreen" class="hidden">
    <div class="game-table-wrapper fade-in">
        <div class="game-top-bar" id="gameTopBar">
            <span class="gtb-item" id="gtbRound">第 0 轮</span>
            <span class="gtb-divider"></span>
            <span class="gtb-item" id="gtbTurn">第 0 回合</span>
            <span class="gtb-divider"></span>
            <span class="gtb-item highlight" id="gtbPhase">等待开始</span>
            <span class="gtb-spacer"></span>
            <button class="btn-back-lobby" id="backToLobbyBtn">返回大厅</button>
        </div>

        <!-- 底部模块：装备 | 手牌 | 技能+武将 -->
        <div class="game-bottom-row">
            <div class="eq-wrapper" id="eqWrapper">
                <div class="eq-title">装 备</div>
                <div class="eq-rows" id="eqRows">
                    <!-- 五行装备由 JS 动态渲染 -->
                </div>
            </div>

            <div class="hand-area" id="handArea">
                <div class="hand-area-inner" id="handAreaInner">
                    <!-- 手牌由 JS 动态渲染 -->
                </div>
            </div>

            <div class="br-wrapper" id="brWrapper">
                <div class="skill-bar" id="skillBar">
                </div>
                <div class="player-card" id="playerCard">
                    <div class="pc-info" id="pcInfo">
                        <div class="pc-char-name" id="pcCharName">卡斯奥佩娅</div>
                        <div class="pc-hp-area" id="pcHpArea"></div>
                    </div>
                    <div class="pc-general-col">
                        <div class="pc-general">
                            <div class="pc-deck-btns" id="pcDeckBtns">
                                <button class="deck-btn" id="deckAboveBtn" title="打开武将牌上方牌堆">上</button>
                                <button class="deck-btn" id="deckSideBtn" title="打开武将牌旁侧牌堆">旁</button>
                            </div>
                            <img class="pc-general-img" src="/images/lol_EZ.png" alt="武将">
                            <span class="pc-name-overlay" id="pcNameOverlay">等待中</span>
                            <span class="pc-role-overlay" id="pcRoleOverlay">?</span>
                            <span class="pc-seat-num" id="pcSeatNum">零</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

    <!-- 游戏结束弹窗 -->
    <div id="gameOverOverlay" class="game-over-overlay hidden">
        <div class="game-over-box fade-in">
            <h2 id="gameOverTitle">游戏结束</h2>
            <p id="gameOverDesc">胜者阵营：--</p>
            <button class="btn btn-primary" id="gameOverOkBtn">知道了</button>
        </div>
    </div>

</div>

<script src="js/game.js"></script>
</body>
</html>
