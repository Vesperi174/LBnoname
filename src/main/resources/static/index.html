<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三国杀 · 联机测试</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">

    <!-- ========== 登录界面 ========== -->
    <div id="loginScreen" class="card fade-in">
        <h2>三国杀 · 联机测试</h2>
        <p class="login-hint">输入昵称开始游戏</p>
        <div class="input-group">
            <input type="text" id="nameInput" placeholder="输入你的昵称..." maxlength="12">
            <button class="btn btn-primary" id="loginBtn">进入</button>
        </div>
        <div class="status-bar" id="loginStatus"></div>
    </div>

    <!-- ========== 主页（桌布背景） ========== -->
    <div id="homeScreen" class="hidden">
        <div class="home-table-wrapper fade-in">
            <!-- 右侧边栏 -->
            <div class="home-sidebar" id="homeSidebar">
                <!-- 自己 -->
                <div class="sidebar-self" id="sidebarSelf">
                    <div class="sidebar-avatar" id="selfAvatar">?</div>
                    <div class="sidebar-info">
                        <span class="sidebar-name" id="selfName">-</span>
                        <span class="sidebar-status status-online" id="selfStatus">在线</span>
                    </div>
                </div>
                <div class="sidebar-divider"></div>
                <!-- 在线列表标题 -->
                <div class="sidebar-list-title">
                    在线玩家 <span class="sidebar-count" id="onlineCount">0</span>
                </div>
                <!-- 玩家列表 -->
                <div class="sidebar-player-list" id="playerList"></div>
            </div>

            <!-- 中央内容区 -->
            <div class="home-content">
                <div class="home-header">
                    <h2>欢迎，<span id="homePlayerName"></span></h2>
                </div>
                <div class="home-room-area">
                    <div class="room-list" id="roomList"></div>
                </div>
                <div class="home-bottom-area">
                    <button class="btn-create-room" id="createRoomBtn">＋ 创建房间</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================
         对局界面
         ============================================================ -->
    <div id="gameScreen" class="hidden">
    <div class="game-table-wrapper fade-in">
        <div class="game-top-bar" id="gameTopBar">
            <span class="gtb-item" id="gtbRound">第 0 轮</span>
            <span class="gtb-divider"></span>
            <span class="gtb-item" id="gtbTurn">第 0 回合</span>
            <span class="gtb-divider"></span>
            <span class="gtb-item highlight" id="gtbPhase">等待开始</span>
            <span class="gtb-spacer"></span>
            <button class="btn-back-lobby" id="backToHomeBtn">返回</button>
        </div>

        <!-- 右侧日志区 -->
        <div class="log-area" id="logArea">
            <div class="log-header">战 报</div>
            <div class="log-content" id="logContent">
                <div class="log-entry log-info">游戏开始，等待出牌...</div>
            </div>
        </div>

        <!-- 其他玩家：上 / 左 / 右 三区 -->
        <div class="opponents-area" id="opponentsArea">
            <div class="opp-row opp-top" id="oppTop"></div>
            <div class="opp-col opp-left" id="oppLeft"></div>
            <div class="opp-col opp-right" id="oppRight"></div>
        </div>

        <!-- 底部模块：装备 | 手牌 | 技能+武将 -->
        <div class="game-bottom-row">
            <div class="eq-wrapper" id="eqWrapper">
                <div class="eq-rows" id="eqRows">
                    <!-- 五行装备由 JS 动态渲染 -->
                </div>
            </div>

            <div class="hand-area-container" id="handAreaContainer">
                <!-- 出牌阶段动作栏（提示文字 + 进度条 + 按钮） -->
                <div class="play-action-bar" id="playActionBar">
                    <div class="play-phase-hint" id="playPhaseHint">出牌阶段，请使用你的手牌</div>
                    <div class="turn-timer" id="turnTimer">
                        <span class="turn-timer-text" id="turnTimerText">15s</span>
                        <div class="turn-timer-track">
                            <div class="turn-timer-bar" id="turnTimerBar"></div>
                        </div>
                    </div>
                    <div class="play-btn-row" id="playBtnRow">
                        <button class="play-btn play-confirm-btn" id="playConfirmBtn" disabled>确定</button>
                        <div class="play-btn-row-spacer"></div>
                        <button class="play-btn play-cancel-btn" id="playCancelBtn" disabled>取消</button>
                        <button class="play-btn play-end-btn" id="playEndBtn">结束阶段</button>
                    </div>
                </div>
                <div class="hand-area" id="handArea">
                    <div class="hand-area-inner" id="handAreaInner">
                        <!-- 手牌由 JS 动态渲染 -->
                    </div>
                </div>
            </div>

            <div class="br-wrapper" id="brWrapper">
                <div class="skill-bar" id="skillBar">
                    <div class="skill-buttons" id="skillButtons"></div>
                </div>
                <div class="player-card" id="playerCard">
                    <div class="pc-info" id="pcInfo">
                        <div class="pc-char-name" id="pcCharName">卡斯奥佩娅</div>
                        <div class="pc-hp-area" id="pcHpArea"></div>
                    </div>
                    <div class="pc-general-col">
                        <div class="pc-general">
                            <div class="pc-deck-btns" id="pcDeckBtns">
                                <button class="deck-btn" id="deckAboveBtn" title="打开武将牌上方牌堆">上</button>
                                <button class="deck-btn" id="deckSideBtn" title="打开武将牌旁侧牌堆">旁</button>
                            </div>
                            <img class="pc-general-img" src="/images/lol_EZ.png" alt="武将">
                            <span class="pc-name-overlay" id="pcNameOverlay">等待中</span>
                            <span class="pc-role-overlay" id="pcRoleOverlay">?</span>
                            <span class="pc-seat-num" id="pcSeatNum">零</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

    <!-- 游戏结束弹窗 -->
    <div id="gameOverOverlay" class="game-over-overlay hidden">
        <div class="game-over-box fade-in">
            <h2 id="gameOverTitle">游戏结束</h2>
            <p id="gameOverDesc">胜者阵营：--</p>
            <button class="btn btn-primary" id="gameOverOkBtn">知道了</button>
        </div>
    </div>

    <!-- 创建房间命名提示框 -->
    <div id="roomNameOverlay" class="room-name-overlay hidden">
        <div class="room-name-box fade-in">
            <h3>创建房间</h3>
            <p class="room-name-hint">请输入房间名称</p>
            <input type="text" class="room-name-input" id="roomNameInput" maxlength="20" placeholder="输入房间名称...">
            <div class="room-name-actions">
                <button class="btn btn-sm btn-secondary" id="roomNameCancelBtn">取消</button>
                <button class="btn btn-sm btn-primary" id="roomNameConfirmBtn">确定</button>
            </div>
        </div>
    </div>

    <!-- 加入房间确认框 -->
    <div id="joinRoomOverlay" class="room-name-overlay hidden">
        <div class="room-name-box fade-in">
            <h3>加入房间</h3>
            <p class="room-name-hint" id="joinRoomHint">是否加入该房间？</p>
            <div class="room-name-actions">
                <button class="btn btn-sm btn-secondary" id="joinRoomCancelBtn">取消</button>
                <button class="btn btn-sm btn-primary" id="joinRoomConfirmBtn">确定</button>
            </div>
        </div>
    </div>

    <!-- 房间界面 -->
    <div id="roomScreen" class="hidden">
        <div class="room-table-wrapper fade-in">
            <div class="room-sidebar" id="roomSidebar">
                <div class="sidebar-self" id="roomSidebarSelf">
                    <div class="sidebar-avatar" id="roomSelfAvatar">?</div>
                    <div class="sidebar-info">
                        <span class="sidebar-name" id="roomSelfName">-</span>
                        <span class="sidebar-status status-online" id="roomSelfStatus">在线</span>
                    </div>
                </div>
                <div class="sidebar-divider"></div>
                <div class="sidebar-list-title">
                    在线玩家 <span class="sidebar-count" id="roomOnlineCount">0</span>
                </div>
                <div class="sidebar-player-list" id="roomPlayerList"></div>
            </div>
            <div class="room-content">
                <div class="room-content-header">
                    <h2 id="roomTitle">房间</h2>
                    <div class="room-header-actions">
                        <button class="btn btn-sm btn-secondary owner-only" id="roomSettingsBtn">⚙ 房间设置</button>
                        <button class="btn btn-sm btn-primary owner-only" id="roomStartBtn">开始游戏</button>
                        <button class="btn btn-sm btn-ready" id="roomReadyBtn">准备</button>
                        <button class="btn btn-sm btn-secondary" id="roomLeaveBtn">← 离开</button>
                    </div>
                </div>
                <div class="room-content-body" id="roomSeats">
                    <div class="room-seat" data-seat="0">
                        <div class="seat-avatar">?</div>
                        <div class="seat-name">等待加入</div>
                        <div class="seat-status">空位</div>
                    </div>
                    <div class="room-seat" data-seat="1">
                        <div class="seat-avatar">?</div>
                        <div class="seat-name">等待加入</div>
                        <div class="seat-status">空位</div>
                    </div>
                    <div class="room-seat" data-seat="2">
                        <div class="seat-avatar">?</div>
                        <div class="seat-name">等待加入</div>
                        <div class="seat-status">空位</div>
                    </div>
                    <div class="room-seat" data-seat="3">
                        <div class="seat-avatar">?</div>
                        <div class="seat-name">等待加入</div>
                        <div class="seat-status">空位</div>
                    </div>
                    <div class="room-seat" data-seat="4">
                        <div class="seat-avatar">?</div>
                        <div class="seat-name">等待加入</div>
                        <div class="seat-status">空位</div>
                    </div>
                    <div class="room-seat" data-seat="5">
                        <div class="seat-avatar">?</div>
                        <div class="seat-name">等待加入</div>
                        <div class="seat-status">空位</div>
                    </div>
                    <div class="room-seat" data-seat="6">
                        <div class="seat-avatar">?</div>
                        <div class="seat-name">等待加入</div>
                        <div class="seat-status">空位</div>
                    </div>
                    <div class="room-seat" data-seat="7">
                        <div class="seat-avatar">?</div>
                        <div class="seat-name">等待加入</div>
                        <div class="seat-status">空位</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ====== 房间设置弹窗 ====== -->
    <div id="roomSettingsOverlay" class="modal-overlay hidden">
        <div class="modal-window" id="roomSettingsPanel">
            <div class="modal-header">
                <span class="modal-title">⚙ 房间设置</span>
                <button class="modal-close-btn" id="roomSettingsCloseBtn" title="关闭">✕</button>
            </div>
            <div class="modal-body">
                <!-- 双内 -->
                <div class="settings-row">
                    <label class="settings-label">
                        <span>双内模式</span>
                        <span class="settings-desc">八人场将一个反贼替换为内奸</span>
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="settingDoubleIntruder">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <!-- 出手时间 -->
                <div class="settings-row">
                    <label class="settings-label">
                        <span>出手时间</span>
                        <span class="settings-desc">每位玩家每回合的操作时限（功能留白）</span>
                    </label>
                    <div class="settings-radios">
                        <label class="radio-btn">
                            <input type="radio" name="turnTime" value="15" checked>
                            <span class="radio-label">15s</span>
                        </label>
                        <label class="radio-btn">
                            <input type="radio" name="turnTime" value="20">
                            <span class="radio-label">20s</span>
                        </label>
                    </div>
                </div>
                <!-- 留白 1 -->
                <div class="settings-row">
                    <label class="settings-label">
                        <span>功能预留1</span>
                        <span class="settings-desc">待开发</span>
                    </label>
                    <span class="settings-placeholder">-</span>
                </div>
                <!-- 留白 2 -->
                <div class="settings-row">
                    <label class="settings-label">
                        <span>功能预留2</span>
                        <span class="settings-desc">待开发</span>
                    </label>
                    <span class="settings-placeholder">-</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-sm btn-secondary" id="roomSettingsCancelBtn">取消</button>
                <button class="btn btn-sm btn-primary" id="roomSettingsSaveBtn">保存</button>
            </div>
        </div>
    </div>

</div>

<script src="js/game.js"></script>
</body>
</html>
